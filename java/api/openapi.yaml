servers:
- url: https://l0ads.signedly.com/
security:
- Bearer: []
tags:
- description: Get and refresh access tokens.
  name: Authentication
- description: Upload documents and find them.
  name: Documents
- description: Who signs a document.
  name: Signatories
- description: "What each signatory fills in, and where."
  name: Fields
- description: Reusable documents with their fields.
  name: Templates
- description: Send a document for signing.
  name: Sending
- description: Send a template to many people.
  name: Bulk sending
- description: Links to the signed PDF and audit trail.
  name: Downloads
- description: Have document events posted to you.
  name: Webhooks
- description: Your recent API calls.
  name: API request logs
paths:
  /ap1/bulk-sends/:
    post:
      description: "Makes and sends one document per row from one of your templates,\
        \ as the web app's Bulk Sending does: each row fills the template's roles\
        \ and fields. Give the rows as a CSV or Excel `file` (multipart) or as JSON\
        \ `rows`, with the columns from GET /ap1/bulk-sends/columns/. The whole file\
        \ is checked first: if any row has a problem nothing is sent and the answer\
        \ lists every one. Up to 1,000 rows; each document is billed like a single\
        \ send. `subject` and `message` may use {{column}} tags. Needs the Teams plan,\
        \ with live or test keys. The documents are made in the background: follow\
        \ them with GET /ap1/bulk-sends/{id}/ (or webhooks)."
      operationId: create_bulk_send
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/create_bulk_send_request'
        required: true
      responses:
        "202":
          content:
            application/json:
              example:
                documents: []
                documents_made: 0
                failed_rows: []
                id: c3a9…
                is_test: false
                sent_at: 2026-10-27
                status: 3
                template_id: 2527…
                total_documents: 2
              schema:
                $ref: '#/components/schemas/create_bulk_send_202_response'
          description: Accepted; the documents are being made.
        "400":
          content:
            application/json:
              example:
                error: |-
                  Fix these rows in the file and upload it again:
                  Row 3: Recipient Email: not an email address
              schema:
                additionalProperties: true
                description: "Why the request was refused: {\"error\": \"...\"}, or\
                  \ each bad field with its messages. See the example."
                type: object
          description: "A row has a problem (every one is listed), a tag isn't a column,\
            \ the date isn't in the future, or the plan isn't Teams."
        "404":
          content:
            application/json:
              example:
                detail: Document not found
              schema:
                additionalProperties: true
                description: "Why the request was refused: {\"error\": \"...\"}, or\
                  \ each bad field with its messages. See the example."
                type: object
          description: The document doesn't exist or isn't your organisation's.
        "429":
          content:
            application/json:
              example:
                detail: Your organisation has made its 50 test documents this month.
              schema:
                additionalProperties: true
                description: "Why the request was refused: {\"error\": \"...\"}, or\
                  \ each bad field with its messages. See the example."
                type: object
          description: "With test keys: more rows than this month's test documents\
            \ left."
      summary: Send a template to many people
      tags:
      - Bulk sending
      x-codegen-request-body-name: data
      x-content-type: application/json
      x-accepts:
      - application/json
  /ap1/bulk-sends/columns/:
    get:
      description: "The columns of a bulk send file (or `rows`) for this template,\
        \ in order: the recipient's name and email, each other open role's name and\
        \ email, and one per field the sender fills in, each with what to put in it.\
        \ Needs the Teams plan, like the bulk send itself."
      operationId: list_bulk_send_columns
      parameters:
      - description: The template's ID.
        in: query
        name: template_id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              example:
              - column: Recipient Name
                example: Asha Rao
                hint: The person's full name
              - column: Salary
                example: Example
                hint: Text
              schema:
                items:
                  $ref: '#/components/schemas/list_bulk_send_columns_200_response_inner'
                type: array
          description: The columns.
        "400":
          content:
            application/json:
              example:
                error: Please upgrade subscription to use this feature. Your plan
                  doesn't include bulk sending.
              schema:
                additionalProperties: true
                description: "Why the request was refused: {\"error\": \"...\"}, or\
                  \ each bad field with its messages. See the example."
                type: object
          description: The organisation admin's plan has no bulk sending (Teams only).
        "404":
          content:
            application/json:
              example:
                detail: Document not found
              schema:
                additionalProperties: true
                description: "Why the request was refused: {\"error\": \"...\"}, or\
                  \ each bad field with its messages. See the example."
                type: object
          description: The document doesn't exist or isn't your organisation's.
      summary: List the columns a template's bulk send needs
      tags:
      - Bulk sending
      x-accepts:
      - application/json
  /ap1/bulk-sends/{id}/:
    get:
      description: "How far the bulk send is: documents made so far, rows that failed,\
        \ and each document's status and signatories."
      operationId: get_bulk_send
      parameters:
      - description: The bulk send's ID.
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        "200":
          content:
            application/json:
              example:
                documents:
                - id: 6f0c…
                  signatories:
                  - email: asha.rao@example.com
                    status: 2
                  status: 4
                documents_made: 1
                failed_rows: []
                id: c3a9…
                is_test: false
                sent_at: 2026-10-27
                status: 3
                template_id: 2527…
                total_documents: 2
              schema:
                $ref: '#/components/schemas/create_bulk_send_202_response'
          description: The bulk send.
        "404":
          content:
            application/json:
              example:
                detail: Bulk send not found
              schema:
                additionalProperties: true
                description: "Why the request was refused: {\"error\": \"...\"}, or\
                  \ each bad field with its messages. See the example."
                type: object
          description: No bulk send of this API client has this ID.
      summary: Follow a bulk send
      tags:
      - Bulk sending
      x-accepts:
      - application/json
  /ap1/document/download-audit-link/:
    get:
      description: "A link to the document's audit trail PDF: who did what, when and\
        \ from where. It is made when the document is completed; ask for it after\
        \ GET /ap1/document/download-link/ gives the signed PDF."
      operationId: get_audit_trail_link
      parameters:
      - description: The document's ID.
        in: query
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        "200":
          content:
            application/json:
              example:
                url: https://signedly-prod.s3.amazonaws.com/…?X-Amz-Signature=…
              schema:
                $ref: '#/components/schemas/get_audit_trail_link_200_response'
          description: The link.
        "404":
          content:
            application/json:
              example:
                error: Document does not exist
              schema:
                additionalProperties: true
                description: "Why the request was refused: {\"error\": \"...\"}, or\
                  \ each bad field with its messages. See the example."
                type: object
          description: The document doesn't exist or isn't yours.
      summary: Get a link to the audit trail
      tags:
      - Downloads
      x-accepts:
      - application/json
  /ap1/document/download-link/:
    get:
      description: "A link to the final signed PDF, once every signatory has signed\
        \ and it has been sealed. Until then the answer is 202: try again later."
      operationId: get_download_link
      parameters:
      - description: The document's ID.
        in: query
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        "200":
          content:
            application/json:
              example:
                url: https://signedly-prod.s3.amazonaws.com/…?X-Amz-Signature=…
              schema:
                $ref: '#/components/schemas/get_audit_trail_link_200_response'
          description: The link.
        "202":
          content:
            application/json:
              example:
                error: "Download is not yet ready, please try after some time."
              schema:
                additionalProperties: true
                description: "Why the request was refused: {\"error\": \"...\"}, or\
                  \ each bad field with its messages. See the example."
                type: object
          description: The signed PDF isn't ready yet.
        "404":
          content:
            application/json:
              example:
                error: Document does not exist
              schema:
                additionalProperties: true
                description: "Why the request was refused: {\"error\": \"...\"}, or\
                  \ each bad field with its messages. See the example."
                type: object
          description: The document doesn't exist or isn't yours.
      summary: Get a link to the signed PDF
      tags:
      - Downloads
      x-accepts:
      - application/json
  /ap1/document/send/:
    post:
      description: "Emails each signatory a signing link with your subject and message\
        \ (with ordered signing, only the first; each next one is emailed in turn).\
        \ The document needs at least one field, and every signatory at least one\
        \ field. A template can't be sent, nor a document that has been sent already,\
        \ and every field must sit on its page. A send that timed out may have worked:\
        \ check the document's status before sending again."
      operationId: send_document
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/send_document_request'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                detail: Document sent successfully
              schema:
                $ref: '#/components/schemas/send_document_200_response'
          description: Sent; the document is now 4 Sent.
        "400":
          content:
            application/json:
              example:
                error:
                - All signatories must be assigned to at least one element.
              schema:
                additionalProperties: true
                description: "Why the request was refused: {\"error\": \"...\"}, or\
                  \ each bad field with its messages. See the example."
                type: object
          description: The document can't be sent (see above). Nothing was sent.
        "403":
          content:
            application/json:
              example:
                detail: Invalid Date Entered
              schema:
                additionalProperties: true
                description: "Why the request was refused: {\"error\": \"...\"}, or\
                  \ each bad field with its messages. See the example."
                type: object
          description: '`expiry_date` isn''t in the future. Nothing was sent.'
        "404":
          content:
            application/json:
              example:
                detail: Document not found
              schema:
                additionalProperties: true
                description: "Why the request was refused: {\"error\": \"...\"}, or\
                  \ each bad field with its messages. See the example."
                type: object
          description: The document doesn't exist or isn't your organisation's.
      summary: Send a document for signing by email
      tags:
      - Sending
      x-codegen-request-body-name: data
      x-content-type: application/json
      x-accepts:
      - application/json
  /ap1/document/send_url/:
    post:
      description: "Marks the document sent without emailing anyone, and returns its\
        \ signatory's signing link to show or send yourself. Meant for a document\
        \ with one signatory. A template can't be sent, nor a document that has been\
        \ sent already, and every field must sit on its page. A send that timed out\
        \ may have worked: check the document's status before sending again."
      operationId: send_document_by_link
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/send_document_by_link_request'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                document_id: 6f0c…
                url: https://apps.signedly.com/api-receiver/U2lnbmVl…/…
              schema:
                $ref: '#/components/schemas/send_document_by_link_200_response'
          description: Sent; the document is now 4 Sent.
        "400":
          content:
            application/json:
              example:
                error:
                - This Document has already been Sent
              schema:
                additionalProperties: true
                description: "Why the request was refused: {\"error\": \"...\"}, or\
                  \ each bad field with its messages. See the example."
                type: object
          description: The document can't be sent (see above). Nothing was sent.
        "403":
          content:
            application/json:
              example:
                detail: Invalid Date Entered
              schema:
                additionalProperties: true
                description: "Why the request was refused: {\"error\": \"...\"}, or\
                  \ each bad field with its messages. See the example."
                type: object
          description: '`expiry_date` isn''t in the future. Nothing was sent.'
        "404":
          content:
            application/json:
              example:
                detail: Document not found
              schema:
                additionalProperties: true
                description: "Why the request was refused: {\"error\": \"...\"}, or\
                  \ each bad field with its messages. See the example."
                type: object
          description: The document doesn't exist or isn't your organisation's.
