      tags:
      - Documents
      x-content-type: application/x-www-form-urlencoded
      x-accepts:
      - application/json
  /ap1/upload_app/:
    post:
      description: "Uploads a PDF or DOCX for one signer and returns their signing\
        \ link in `redirect_url`; give it to the signer. They place their own signature\
        \ on the signing page and are then sent to the `redirect_url` you gave. The\
        \ signed PDF and its audit trail are emailed to `final_email`, or to your\
        \ organisation's admin without one."
