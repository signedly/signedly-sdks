        \ is made in the background. Find it in `GET /ap1/documents/?name=<name>`\
        \ (its `upload.id` is this upload's `id`), or a template in `GET /ap1/templates/`,\
        \ and wait until `GET /ap1/documents/{id}/pages/` lists its pages before placing\
        \ fields."
      operationId: upload_document
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/upload_document_request'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/upload_document_request'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                created_at: 2026-10-26T12:00:00Z
                id: 2527…
                is_test: false
                mimetype: application/pdf
                name: nda.pdf
                status: 2
                type: 2
                updated_at: 2026-10-26T12:00:00Z
              schema:
                $ref: '#/components/schemas/Upload'
          description: The upload. Its `status` is 2 Uploaded; the document is made
            next.
        "400":
          content:
            application/json:
              example:
                file:
                - File already exists with this name
              schema:
                additionalProperties: true
                description: "Why the request was refused: {\"error\": \"...\"}, or\
                  \ each bad field with its messages. See the example."
                type: object
          description: "The file is missing, not a PDF or DOCX, or over 2 MB; the\
            \ name is taken; or `type` or `template_name` is missing or wrong."
