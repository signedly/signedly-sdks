name: SDKs

on:
  pull_request:
  push:
    branches: [main]

jobs:
  drift:
    name: Generated code matches the spec
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: scripts/generate.sh
      - name: No difference after regenerating
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)" || { git diff --stat; exit 1; }

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ./python pytest
      - run: cd python && pytest -q test/test_helpers.py

  node:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: cd node && npm install && npm run build && node --test helpers.test.mjs

  php:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.2", tools: composer }
      - run: cd php && composer install --no-interaction && vendor/bin/phpunit test/Helpers

  java:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: maven }
      - run: cd java && mvn -B -q test -Dtest=WebhookTest -Dsurefire.failIfNoSpecifiedTests=false
