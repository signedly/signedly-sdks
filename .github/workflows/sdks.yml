name: SDKs

on:
  pull_request:
  push:
    branches: [integration]

# A newer push to the same PR or branch cancels the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: Generated code matches the spec
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "25" }
      - run: scripts/generate.sh
      - name: No difference after regenerating
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)" || { git diff --stat; exit 1; }

  python:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install ./python pytest
      - run: cd python && pytest -q test/test_helpers.py
      - name: Logs in, sends the token and uploads a PDF (fake Signedly)
        run: |
          python3 scripts/fake_signedly.py 8765 &
          for i in $(seq 40); do curl -s -o /dev/null localhost:8765 && break; sleep 0.25; done
          python -c '
          from signedly.helpers import SignedlyClient
          from signedly.api.documents_api import DocumentsApi
          documents = DocumentsApi(SignedlyClient("id", "secret", host="http://127.0.0.1:8765").api_client)
          assert documents.list_documents().count == 0
          assert documents.upload_document(file=("t.pdf", b"%PDF-1.4 test"), name="t", type=2).is_test'

  node:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "26"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "${{ matrix.node }}" }
      - run: cd node && npm install && npm run build && node --test helpers.test.mjs
      - name: Logs in, sends the token and uploads a PDF (fake Signedly)
        run: |
          python3 scripts/fake_signedly.py 8765 &
          for i in $(seq 40); do curl -s -o /dev/null localhost:8765 && break; sleep 0.25; done
          cd node && node -e '
          const { DocumentsApi } = require("./dist");
          const { signedlyConfiguration } = require("./dist/helpers");
          const documents = new DocumentsApi(signedlyConfiguration("id", "secret", "http://127.0.0.1:8765"));
          (async () => {
            if ((await documents.listDocuments()).data.count !== 0) process.exit(1);
            const pdf = new Blob([Buffer.from("%PDF-1.4 test")], { type: "application/pdf" });
            if (!(await documents.uploadDocument(pdf, "t", 2)).data.is_test) process.exit(1);
          })().catch((e) => { console.error(e.message); process.exit(1); });'

  php:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.5"]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with: { php-version: "${{ matrix.php }}", tools: composer }
      - run: cd php && composer install --no-interaction && vendor/bin/phpunit test/Helpers
      - name: Logs in, sends the token and uploads a PDF (fake Signedly)
        run: |
          python3 scripts/fake_signedly.py 8765 &
          for i in $(seq 40); do curl -s -o /dev/null localhost:8765 && break; sleep 0.25; done
          printf '%%PDF-1.4 test' > /tmp/t.pdf
          cd php && php -r '
          require "vendor/autoload.php";
          $auth = new \Signedly\Helpers\SignedlyAuth("id", "secret", "http://127.0.0.1:8765");
          $documents = new \Signedly\Api\DocumentsApi(null, $auth->config());
          if ($documents->listDocuments()->getCount() !== 0) exit(1);
          exit($documents->uploadDocument(new \SplFileObject("/tmp/t.pdf"), "t", 2)->getIsTest() ? 0 : 1);'
      - name: The Packagist package (root composer.json) installs php/lib
        run: |
          python3 -c '
          import json, sys
          root, php = json.load(open("composer.json")), json.load(open("php/composer.json"))
          if root["require"] != php["require"]:
              sys.exit("composer.json require differs from php/composer.json: copy it over.")'
          composer validate --strict
          composer install --no-interaction --no-dev
          php -r 'require "vendor/autoload.php"; exit(class_exists("Signedly\\Api\\DocumentsApi") && class_exists("Signedly\\Helpers\\SignedlyAuth") ? 0 : 1);'

  java:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        java: ["11", "25"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "${{ matrix.java }}", cache: maven }
      - run: cd java && mvn -B -q test -Dtest='WebhookTest,LoginTest' -Dsurefire.failIfNoSpecifiedTests=false
