name: SDKs

on:
  pull_request:
  push:
    branches: [integration]

jobs:
  drift:
    name: Generated code matches the spec
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: scripts/generate.sh
      - name: No difference after regenerating
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)" || { git diff --stat; exit 1; }

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ./python pytest
      - run: cd python && pytest -q test/test_helpers.py
      - name: Logs in and sends the token (fake Signedly)
        run: |
          python3 scripts/fake_signedly.py 8765 &
          for i in $(seq 40); do curl -s -o /dev/null localhost:8765 && break; sleep 0.25; done
          python -c 'from signedly.helpers import SignedlyClient; from signedly.api.documents_api import DocumentsApi; assert DocumentsApi(SignedlyClient("id", "secret", host="http://127.0.0.1:8765").api_client).list_documents().count == 0'

  node:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: cd node && npm install && npm run build && node --test helpers.test.mjs
      - name: Logs in and sends the token (fake Signedly)
        run: |
          python3 scripts/fake_signedly.py 8765 &
          for i in $(seq 40); do curl -s -o /dev/null localhost:8765 && break; sleep 0.25; done
          cd node && node -e 'const { DocumentsApi } = require("./dist"); const { signedlyConfiguration } = require("./dist/helpers"); new DocumentsApi(signedlyConfiguration("id", "secret", "http://127.0.0.1:8765")).listDocuments().then((r) => { if (r.data.count !== 0) process.exit(1); }, (e) => { console.error(e.message); process.exit(1); });'

  php:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.2", tools: composer }
      - run: cd php && composer install --no-interaction && vendor/bin/phpunit test/Helpers
      - name: Logs in and sends the token (fake Signedly)
        run: |
          python3 scripts/fake_signedly.py 8765 &
          for i in $(seq 40); do curl -s -o /dev/null localhost:8765 && break; sleep 0.25; done
          cd php && php -r 'require "vendor/autoload.php"; $auth = new \Signedly\Helpers\SignedlyAuth("id", "secret", "http://127.0.0.1:8765"); exit((new \Signedly\Api\DocumentsApi(null, $auth->config()))->listDocuments()->getCount() === 0 ? 0 : 1);'
      - name: The Packagist package (root composer.json) installs php/lib
        run: |
          python3 -c '
          import json, sys
          root, php = json.load(open("composer.json")), json.load(open("php/composer.json"))
          if root["require"] != php["require"]:
              sys.exit("composer.json require differs from php/composer.json: copy it over.")'
          composer validate --strict
          composer install --no-interaction --no-dev
          php -r 'require "vendor/autoload.php"; exit(class_exists("Signedly\\Api\\DocumentsApi") && class_exists("Signedly\\Helpers\\SignedlyAuth") ? 0 : 1);'

  java:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: maven }
      - run: cd java && mvn -B -q test -Dtest='WebhookTest,LoginTest' -Dsurefire.failIfNoSpecifiedTests=false
